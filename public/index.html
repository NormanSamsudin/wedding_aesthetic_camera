<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FAF7F2">
  <title>Wish Booth</title>
  <link rel="stylesheet" href="/booth.css">
</head>
<body>
  <!-- Live camera, shared by every screen. Mirrored like a mirror. -->
  <video id="preview" class="cam" autoplay muted playsinline></video>
  <div class="frame"></div>

  <section id="s-welcome" class="screen soft active">
    <div class="center">
      <p class="small" data-text="welcomeLine"></p>
      <h1 class="names" data-text="couple"></h1>
      <div class="rule"></div>
      <p class="small" data-text="date"></p>
      <button class="btn" id="start" data-i18n="start">Start recording</button>
      <button class="link" id="watch" data-i18n="watch">Watch the wishes</button>
    </div>
    <!-- Quiet notes for the organiser: low storage, wishes not sent yet. -->
    <p class="notice" id="notice" hidden></p>
  </section>

  <section id="s-countdown" class="screen live">
    <div id="count" class="count">3</div>
    <p class="prompt" data-prompt></p>
    <div class="bar"><span class="small light" data-i18n="getReady">Get ready, look at the camera</span></div>
  </section>

  <section id="s-recording" class="screen live">
    <div class="pill"><span class="dot"></span><span id="timer">00:00</span></div>
    <p class="prompt" data-prompt></p>
    <div class="bar"><button id="stop" class="stop" aria-label="Stop recording"><i></i></button></div>
  </section>

  <section id="s-review" class="screen dark">
    <video id="playback" class="cam unmirrored" playsinline></video>
    <button id="play" class="play" aria-label="Play"></button>
    <div class="bar">
      <button class="btn glass" id="retake" data-i18n="retake">Re-record</button>
      <button class="btn" id="send" data-i18n="send">Send wish</button>
    </div>
  </section>

  <section id="s-sending" class="screen paper">
    <div class="center">
      <p class="small" data-i18n="saving">Saving your wish</p>
      <div class="progress"><b id="progress"></b></div>
      <div id="send-error" hidden>
        <p class="note" id="send-error-text"></p>
        <button class="btn" id="retry" data-i18n="tryAgain">Try again</button>
      </div>
    </div>
  </section>

  <section id="s-thanks" class="screen paper">
    <div class="center">
      <div class="heart">&#9825;</div>
      <h2 class="title" id="thanks-title" data-i18n="thanks">Thank you</h2>
      <div class="rule"></div>
      <p class="small" id="thanks-note">Your wish has been saved</p>
    </div>
  </section>

  <section id="s-no-event" class="screen paper">
    <div class="center narrow">
      <p class="small">Not ready yet</p>
      <h2 class="title">Select an event first</h2>
      <p class="note">Choose which event these wishes belong to. Each event saves its videos in its own folder.</p>
      <a class="btn" href="/settings/">Open settings</a>
    </div>
  </section>

  <section id="s-blocked" class="screen paper">
    <div class="center narrow">
      <h2 class="title">The camera isn't available</h2>
      <p class="note" id="blocked-reason"></p>
      <button class="btn" onclick="location.reload()">Try again</button>
    </div>
  </section>

  <!-- The gallery opens inside this page so the tablet stays full screen
       and the camera stays on. -->
  <iframe id="gallery" class="gallery-frame" title="Wishes" allow="autoplay; fullscreen" allowfullscreen hidden></iframe>

  <script src="/i18n.js"></script>
  <script src="/queue.js"></script>
  <script src="/booth.js"></script>
</body>
</html>
